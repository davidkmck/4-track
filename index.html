<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quick Multitrack</title>
  <link rel="manifest" href="./manifest.json">
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --text-main: #f8fafc;
      --accent: #3b82f6;
      --danger: #ef4444;
      --success: #10b981;
      --warning: #f59e0b; /* New countdown warning amber accent */
    }

    body {
      margin: 0;
      padding: 20px;
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    main {
      width: 100%;
      max-width: 500px;
    }

    h1 {
      text-align: center;
      font-size: 1.75rem;
      margin-bottom: 5px;
    }

    .subtitle {
      text-align: center;
      color: #94a3b8;
      font-size: 0.9rem;
      margin-bottom: 25px;
    }

    #controls-sector {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 30px;
    }

    .button-group {
      display: flex;
      gap: 10px;
      width: 100%;
    }

    button {
      padding: 12px 15px;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      font-size: 0.95rem;
      transition: background-color 0.2s, opacity 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    button:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .btn-record {
      background-color: var(--accent);
      color: white;
      flex: none;
      width: 100%;
    }

    /* Style rule specific to the ticking countdown step */
    .btn-countdown {
      background-color: var(--warning);
      color: white;
      flex: none;
      width: 100%;
    }

    .btn-recording {
      background-color: var(--danger);
      animation: pulse 1.5s infinite;
      color: white;
      flex: none;
      width: 100%;
    }

    .btn-global {
      background-color: #475569;
      color: white;
    }

    .btn-save {
      background-color: var(--success);
      color: white;
      flex: none;
      width: 100%;
    }

    .toggle-container {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background-color: var(--card-bg);
      padding: 12px 15px;
      border-radius: 8px;
      margin-top: 5px;
      font-weight: 600;
      font-size: 0.95rem;
    }

    .toggle-label-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .switch {
      position: relative;
      display: inline-block;
      width: 50px;
      height: 26px;
    }

    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider-toggle {
      position: absolute;
      cursor: pointer;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: #475569;
      transition: .3s;
      border-radius: 34px;
    }

    .slider-toggle:before {
      position: absolute;
      content: "";
      height: 18px;
      width: 18px;
      left: 4px;
      bottom: 4px;
      background-color: white;
      transition: .3s;
      border-radius: 50%;
    }

    input:checked + .slider-toggle {
      background-color: var(--accent);
    }

    input:checked + .slider-toggle:before {
      transform: translateX(24px);
    }

    .mixer-board {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .track-row {
      background-color: var(--card-bg);
      padding: 15px;
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
    }

    .track-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .track-title {
      font-weight: 600;
      color: #cbd5e1;
    }

    .btn-delete {
      background-color: transparent;
      color: var(--danger);
      padding: 5px 10px;
      font-size: 0.85rem;
      flex: none;
    }

    .controls-container {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .slider-container {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .slider-label {
      font-size: 0.75rem;
      color: #94a3b8;
      display: flex;
      justify-content: space-between;
    }

    input[type="range"] {
      width: 100%;
      accent-color: var(--accent);
    }

    input[type="range"].progress-slider {
      accent-color: var(--success);
      cursor: default;
    }

    @keyframes pulse {
      0% { opacity: 1; }
      50% { opacity: 0.6; }
      100% { opacity: 1; }
    }
  </style>
</head>
<body>

  <audio id="ios-audio-0" playsinline></audio>
  <audio id="ios-audio-1" playsinline></audio>
  <audio id="ios-audio-2" playsinline></audio>
  <audio id="ios-audio-3" playsinline></audio>

<main>
    <h1>Quick Multitrack</h1>
    <section id="controls-sector">
      <button id="record-btn" class="btn-record">🔴 Record Track 1</button>
      <div class="button-group">
        <button id="master-play-btn" class="btn-global" disabled>▶️</button>
        <button id="reset-btn" class="btn-global" disabled>⏮️</button>
      </div>
      <div class="toggle-container">
        <span>🔁 Master Loop</span>
        <input type="checkbox" id="loop-toggle" checked>
      </div>
      <button id="save-mix-btn" class="btn-save" disabled>💾</button>
    </section>
    <section class="mixer-board" id="mixer-board"></section>
  </main>

  <script>
    let audioCtx = null;
    let mediaRecorder = null;
    let recordedChunks = [];
    let isRecording = false;
    let isCountdownActive = false; // Prevents spamming clicks during count-in
    let isPlayingMix = false;
    let localStream = null;
    let masterLoopInterval = null; 
    const maxTracks = 4;
    const tracks = [];

    const recordBtn = document.getElementById('record-btn');
    const masterPlayBtn = document.getElementById('master-play-btn');
    const resetBtn = document.getElementById('reset-btn');
    const loopToggle = document.getElementById('loop-toggle');
    const saveMixBtn = document.getElementById('save-mix-btn');
    const mixerBoard = document.getElementById('mixer-board');

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    masterPlayBtn.addEventListener('click', () => {
      initAudio();
      if (isPlayingMix) {
        stopAllTracks();
      } else {
        startAllTracks();
      }
    });

    resetBtn.addEventListener('click', () => {
      initAudio();
      stopAllTracks();
      resetAllPlayheads();
    });

    recordBtn.addEventListener('click', async () => {
      initAudio();
      if (isCountdownActive) return; // Block double-triggering during countdown
      
      if (tracks && tracks.length > 0) {
        tracks.forEach(t => {
          if (t.audioEl) {
            t.audioEl.play().catch(() => {});
            t.audioEl.pause();
          }
        });
      }
      
      if (!isRecording) {
        if (tracks.length >= maxTracks) return;
        
        try {
          // Request mic access synchronously upfront on the user-gesture thread
          localStream = await navigator.mediaDevices.getUserMedia({ audio: true });
          
          isCountdownActive = true;
          recordBtn.className = "btn-countdown";
          
          // 3-Second Count-in Async Sequence Loops
          let count = 3;
          recordBtn.textContent = `⏳ Recording starts in ${count}...`;
          
          const countdownInterval = setInterval(() => {
            count--;
            if (count > 0) {
              recordBtn.textContent = `⏳ Recording starts in ${count}...`;
            } else {
              clearInterval(countdownInterval);
              isCountdownActive = false;
              startHardwareRecording();
            }
          }, 1000);

        } catch (err) {
          console.error('Microphone access denied:', err);
          alert('Could not access microphone. Check site permissions.');
        }
      } else {
        if (mediaRecorder && mediaRecorder.state !== "inactive") {
          mediaRecorder.stop();
        }
        isRecording = false;
      }
    });
