<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quick Multitrack</title>
  <link rel="manifest" href="./manifest.json">
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --text-main: #f8fafc;
      --accent: #3b82f6;
      --danger: #ef4444;
      --success: #10b981;
      --warning: #f59e0b;
    }
    body {
      margin: 0;
      padding: 20px;
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    main {
      width: 100%;
      max-width: 500px;
    }
    h1 {
      text-align: center;
      font-size: 1.75rem;
      margin-bottom: 5px;
    }
    .subtitle {
      text-align: center;
      color: #94a3b8;
      font-size: 0.9rem;
      margin-bottom: 25px;
    }
    #controls-sector {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 30px;
    }
    .button-group {
      display: flex;
      gap: 10px;
      width: 100%;
    }
    button {
      padding: 12px 15px;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      font-size: 0.95rem;
      transition: background-color 0.2s, opacity 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    button:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }
    .btn-record {
      background-color: var(--accent);
      color: white;
      flex: none;
      width: 100%;
    }
    .btn-countdown {
      background-color: var(--warning);
      color: white;
      flex: none;
      width: 100%;
    }
    .btn-recording {
      background-color: var(--danger);
      animation: pulse 1.5s infinite;
      color: white;
      flex: none;
      width: 100%;
    }
    .btn-global {
      background-color: #475569;
      color: white;
      flex: 1;
    }
    .btn-save {
      background-color: var(--success);
      color: white;
      flex: none;
      width: 100%;
    }
    .toggle-container {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background-color: var(--card-bg);
      padding: 12px 15px;
      border-radius: 8px;
      margin-top: 5px;
      font-weight: 600;
      font-size: 0.95rem;
    }
    .toggle-label-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .switch {
      position: relative;
      display: inline-block;
      width: 50px;
      height: 26px;
    }
    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }
    .slider-toggle {
      position: absolute;
      cursor: pointer;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: #475569;
      transition: .3s;
      border-radius: 34px;
    }
    .slider-toggle:before {
      position: absolute;
      content: "";
      height: 18px;
      width: 18px;
      left: 4px;
      bottom: 4px;
      background-color: white;
      transition: .3s;
      border-radius: 50%;
    }
    input:checked + .slider-toggle {
      background-color: var(--accent);
    }
    input:checked + .slider-toggle:before {
      transform: translateX(24px);
    }
    .mixer-board {
      display: flex;
      flex-direction: column;
      gap: 15px;
      width: 100%;
    }
    .track-row {
      background-color: var(--card-bg);
      padding: 15px;
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
    }
    .track-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .track-title {
      font-weight: 600;
      color: #cbd5e1;
    }
    .btn-delete {
      background-color: transparent;
      color: var(--danger);
      padding: 5px 10px;
      font-size: 0.85rem;
      flex: none;
    }
    .controls-container {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .slider-container {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .slider-label {
      font-size: 0.75rem;
      color: #94a3b8;
      display: flex;
      justify-content: space-between;
    }
    input[type="range"] {
      width: 100%;
      accent-color: var(--accent);
    }
    input[type="range"].progress-slider {
      accent-color: var(--success);
      cursor: default;
    }
    @keyframes pulse {
      0% { opacity: 1; }
      50% { opacity: 0.6; }
      100% { opacity: 1; }
    }
  </style>
</head>
<body>

  <main>
    <h1>Quick Multitrack</h1>
    <div class="subtitle">Record cumulative tracks via microphone</div>

    <section id="controls-sector">
      <button id="record-btn" class="btn-record">🔴 Record Track 1</button>
      
      <button id="import-btn" class="btn-global" style="background-color: #475569; width: 100%; flex: none;">📁 Import Audio File</button>
      <input type="file" id="audio-file-input" accept="audio/*" style="display: none;">

      <div class="button-group">
        <button id="master-play-btn" class="btn-global" disabled>▶️ Play Mix</button>
        <button id="reset-btn" class="btn-global" disabled>⏮️ Restart</button>
      </div>

      <div class="toggle-container">
        <div class="toggle-label-group">
          <span>🔁</span>
          <span>Master Loop Repeat</span>
        </div>
        <label class="switch">
          <input type="checkbox" id="loop-toggle" checked>
          <span class="slider-toggle"></span>
        </label>
      </div>

      <button id="save-mix-btn" class="btn-save" disabled>💾 Save Mix to File</button>
    </section>

    <section class="mixer-board" id="mixer-board"></section>
  </main>

  <script>
    // ─── State ────────────────────────────────────────────────────────────────
    let mediaRecorder = null;
    let recordedChunks = [];
    let isRecording = false;
    let isCountdownActive = false;
    let isPlayingMix = false;
    let localStream = null;
    let masterLoopInterval = null;
    const maxTracks = 4;

    // Each track: { id, blob, blobUrl, audioEl, panNode, gainNode, currentPan, currentVolume, duration }
    const tracks = [];

    // One shared AudioContext for live playback (created on first user gesture)
    let audioCtx = null;

    // ─── DOM refs ─────────────────────────────────────────────────────────────
    const recordBtn       = document.getElementById('record-btn');
    const importBtn       = document.getElementById('import-btn');
    const audioFileInput  = document.getElementById('audio-file-input');
    const masterPlayBtn   = document.getElementById('master-play-btn');
    const resetBtn        = document.getElementById('reset-btn');
    const loopToggle      = document.getElementById('loop-toggle');
    const saveMixBtn      = document.getElementById('save-mix-btn');
    const mixerBoard      = document.getElementById('mixer-board');

    // ─── AudioContext bootstrap ───────────────────────────────────────────────
    function getAudioContext() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      return audioCtx;
    }

    // Wire a track's <audio> element into the Web Audio graph so pan works.
    // Safe to call multiple times — guard with track.sourceNode.
    function wireTrackToGraph(track) {
      const ctx = getAudioContext();
      if (track.sourceNode) return; // already wired

      const source  = ctx.createMediaElementSource(track.audioEl);
      const gain    = ctx.createGain();
      const panner  = ctx.createStereoPanner();

      gain.gain.value   = track.currentVolume;
      panner.pan.value  = track.currentPan;

      source.connect(gain);
      gain.connect(panner);
      panner.connect(ctx.destination);

      track.sourceNode = source;
      track.gainNode   = gain;
      track.panNode    = panner;
    }

    // ─── Record button ────────────────────────────────────────────────────────
    recordBtn.addEventListener('click', async () => {
      if (isCountdownActive) return;

      if (!isRecording) {
        if (tracks.length >= maxTracks) return;

        try {
          localStream = await navigator.mediaDevices.getUserMedia({ audio: true });
          isCountdownActive = true;
          recordBtn.className = 'btn-countdown';
          
          let count = 3;
          recordBtn.textContent = `⏳ Recording starts in ${count}...`;

          const countdownInterval = setInterval(() => {
            count--;
            if (count > 0) {
              recordBtn.textContent = `⏳ Recording starts in ${count}...`;
            } else {
              clearInterval(countdownInterval);
              isCountdownActive = false;
              startHardwareRecording();
            }
          }, 1000);

        } catch (err) {
          console.error('Microphone access denied:', err);
          alert('Could not access microphone. Check site permissions.');
        }
      } else {
        if (mediaRecorder && mediaRecorder.state !== 'inactive') {
          mediaRecorder.stop();
        }
        isRecording = false;
      }
    });

    // ─── Import functionality ─────────────────────────────────────────────────
    importBtn.addEventListener('click', () => {
      if (tracks.length >= maxTracks) return;
      audioFileInput.click();
    });

    audioFileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;

      if (!file.type.startsWith('audio/')) {
        alert('Please select a valid audio file.');
        return;
      }

      // Since File inherits from Blob, it seamlessly registers with your code
      createTrackNode(file);
      
      // Clear input so the same file can be imported again if deleted
      audioFileInput.value = '';
    });

    // ─── Recording logic ──────────────────────────────────────────────────────
    function startHardwareRecording() {
      recordedChunks = [];
      if (tracks.length > 0) {
        resetAllPlayheads();
        startAllTracks({ monitoringOnly: true });
      }

      const mimeType = getSupportedMimeType();
      const recorderOptions = mimeType ? { mimeType } : {};

      mediaRecorder = new MediaRecorder(localStream, recorderOptions);
      mediaRecorder.ondataavailable = (e) => {
        if (e.data.size > 0) recordedChunks.push(e.data);
      };

      mediaRecorder.onstop = () => {
        stopAllTracks();
        const blob = new Blob(recordedChunks, { type: mediaRecorder.mimeType || 'audio/webm' });
        createTrackNode(blob);

        if (localStream) {
          localStream.getTracks().forEach(t => t.stop());
          localStream = null;
        }
        updateUI();
      };

      mediaRecorder.start();
      isRecording = true;
      recordBtn.textContent = '⏹️ Stop Recording';
      recordBtn.className = 'btn-recording';
    }

    function getSupportedMimeType() {
      const candidates = [
        'audio/webm;codecs=opus',
        'audio/webm',
        'audio/ogg;codecs=opus',
        'audio/mp4',
      ];
      return candidates.find(m => MediaRecorder.isTypeSupported(m)) || '';
    }

    // ─── Track creation ───────────────────────────────────────────────────────
    function createTrackNode(blob) {
      const blobUrl = URL.createObjectURL(blob);
      const audioEl = new Audio();
      audioEl.src = blobUrl;
      audioEl.loop = false;
      audioEl.preload = 'auto';
      audioEl.setAttribute('playsinline', '');
      audioEl.crossOrigin = 'anonymous';
      audioEl.load();

      const trackObject = {
        id: Date.now(),
        blob,
        blobUrl,
        audioEl,
        sourceNode: null,
        gainNode:   null,
        panNode:    null,
        currentPan: 0,
        currentVolume: 1.0,
        duration: 0,
      };

      audioEl.addEventListener('loadedmetadata', () => {
        trackObject.duration = audioEl.duration || 0;
        renderMixerBoard();
      });

      audioEl.addEventListener('timeupdate', () => {
        const progSlider  = document.getElementById(`progress-${trackObject.id}`);
        const currentText = document.getElementById(`current-time-${trackObject.id}`);
        if (progSlider)  progSlider.value       = audioEl.currentTime;
        if (currentText) currentText.textContent = audioEl.currentTime.toFixed(1
