<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quick Multitrack</title>
  <link rel="stylesheet" href="./manifest.json">
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --text-main: #f8fafc;
      --accent: #3b82f6;
      --danger: #ef4444;
      --success: #10b981;
    }

    body {
      margin: 0;
      padding: 20px;
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    main {
      width: 100%;
      max-width: 500px;
    }

    h1 {
      text-align: center;
      font-size: 1.75rem;
      margin-bottom: 5px;
    }

    .subtitle {
      text-align: center;
      color: #94a3b8;
      font-size: 0.9rem;
      margin-bottom: 25px;
    }

    #controls-sector {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 30px;
    }

    .button-group {
      display: flex;
      gap: 10px;
      width: 100%;
    }

    button {
      padding: 12px 20px;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      font-size: 1rem;
      transition: opacity 0.2s;
      flex: 1;
    }

    button:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .btn-record {
      background-color: var(--accent);
      color: white;
      flex: none;
      width: 100%;
    }

    .btn-recording {
      background-color: var(--danger);
      animation: pulse 1.5s infinite;
      color: white;
      flex: none;
      width: 100%;
    }

    .btn-global {
      background-color: #475569;
      color: white;
    }

    .btn-save {
      background-color: var(--success);
      color: white;
    }

    /* Mixer Board Layout */
    .mixer-board {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .track-row {
      background-color: var(--card-bg);
      padding: 15px;
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
    }

    .track-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .track-title {
      font-weight: 600;
      color: #cbd5e1;
    }

    .btn-delete {
      background-color: transparent;
      color: var(--danger);
      padding: 5px 10px;
      font-size: 0.85rem;
      flex: none;
    }

    .controls-container {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .slider-container {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .slider-label {
      font-size: 0.75rem;
      color: #94a3b8;
      display: flex;
      justify-content: space-between;
    }

    input[type="range"] {
      width: 100%;
      accent-color: var(--accent);
    }

    @keyframes pulse {
      0% { opacity: 1; }
      50% { opacity: 0.6; }
      100% { opacity: 1; }
    }
  </style>
</head>
<body>

  <main>
    <h1>Quick Multitrack</h1>
    <div class="subtitle">Record cumulative tracks via microphone</div>

    <section id="controls-sector">
      <button id="record-btn" class="btn-record">Record Track 1</button>
      <div class="button-group">
        <button id="master-play-btn" class="btn-global" disabled>Play Mix</button>
        <button id="reset-btn" class="btn-global" disabled>Restart from 0</button>
      </div>
      <button id="save-mix-btn" class="btn-save" disabled>Save Mix to File</button>
    </section>

    <section class="mixer-board" id="mixer-board">
      </section>
  </main>

  <script>
    let audioCtx = null;
    let mediaRecorder = null;
    let recordedChunks = [];
    let isRecording = false;
    let isPlayingMix = false;
    let localStream = null;
    const maxTracks = 4;
    const tracks = [];

    const recordBtn = document.getElementById('record-btn');
    const masterPlayBtn = document.getElementById('master-play-btn');
    const resetBtn = document.getElementById('reset-btn');
    const saveMixBtn = document.getElementById('save-mix-btn');
    const mixerBoard = document.getElementById('mixer-board');

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    masterPlayBtn.addEventListener('click', () => {
      initAudio();
      if (isPlayingMix) {
        stopAllTracks();
      } else {
        startAllTracks();
      }
    });

    resetBtn.addEventListener('click', () => {
      initAudio();
      if (tracks && tracks.length > 0) {
        tracks.forEach(track => {
          if (track.audioEl) track.audioEl.currentTime = 0;
        });
      }
      if (!isPlayingMix && tracks.length > 0) {
        startAllTracks();
      }
    });

    recordBtn.addEventListener('click', async () => {
      initAudio();
      
      if (!isRecording) {
        if (tracks.length >= maxTracks) return;
        try {
          recordedChunks = [];
          
          // Fixed safety check: Only reset loop timestamps if tracks actually exist yet
          if (tracks && tracks.length > 0) {
            tracks.forEach(t => {
              if (t.audioEl) t.audioEl.currentTime = 0;
            });
            startAllTracks({ monitoringOnly: true });
          }

          localStream = await navigator.mediaDevices.getUserMedia({ audio: true });

          mediaRecorder = new MediaRecorder(localStream);
          mediaRecorder.ondataavailable = (e) => {
            if (e.data.size > 0) recordedChunks.push(e.data);
          };

          mediaRecorder.onstop = () => {
            stopAllTracks();
            const blob = new Blob(recordedChunks, { type: 'audio/webm' });
            createTrackNode(blob);
            
            if (localStream) {
              localStream.getTracks().forEach(track => track.stop());
            }
            updateUI();
          };

          mediaRecorder.start();
          isRecording = true;
          recordBtn.textContent = "Stop Recording";
          recordBtn.className = "btn-recording";
        } catch (err) {
          console.error('Microphone access denied:', err);
          alert('Could not access microphone. Check site permissions.');
        }
      } else {
        if (mediaRecorder && mediaRecorder.state !== "inactive") {
          mediaRecorder.stop();
        }
        isRecording = false;
      }
    });

    function createTrackNode(blob) {
      const trackId = Date.now();
      const audioUrl = URL.createObjectURL(blob);
      const audioEl = new Audio(audioUrl);
      audioEl.loop = true;

      const source = audioCtx.createMediaElementSource(audioEl);
      const panner = audioCtx.createStereoPanner();
      const gainNode = audioCtx.createGain();
      
      source.connect(gainNode);
      gainNode.connect(panner);
      panner.connect(audioCtx.destination);

      const trackObject = {
        id: trackId,
        audioEl,
        panner,
        gainNode,
        blob,
        currentPan: 0,
        currentVolume: 1.0
      };

      tracks.push(trackObject);
      renderMixerBoard();
    }

    function renderMixerBoard() {
      mixerBoard.innerHTML = '';
      tracks.forEach((track, index) => {
        const row = document.createElement('div');
        row.className = 'track-row';
        row.innerHTML = `
          <div class="track-header">
            <span class="track-title">Track ${index + 1}</span>
            <button class="btn-delete" onclick="deleteTrack(${track.id})">Delete</button>
          </div>
          <div class="controls-container">
            <div class="slider-container">
              <div class="slider-label">
                <span>Volume</span>
                <span id="vol-txt-${track.id}">${Math.round(track.currentVolume * 100)}%</span>
              </div>
              <input type="range" min="0" max="1.5" step="0.05" value="${track.currentVolume}" 
                oninput="updateVolume(${track.id}, this.value)">
            </div>
            <div class="slider-container">
              <div class="slider-label">
                <span>Left</span>
                <span>Stereo Pan</span>
                <span>Right</span>
              </div>
              <input type="range" min="-1" max="1" step="0.1" value="${track.currentPan}" 
                oninput="updatePan(${track.id}, this.value)">
            </div>
          </div>
        `;
        mixerBoard.appendChild(row);
      });
      updateUI();
    }

    function updateVolume(id, val) {
      const track = tracks.find(t => t.id === id);
      if (track) {
        track.currentVolume = parseFloat(val);
        track.gainNode.gain.value = track.currentVolume;
        document.getElementById(`vol-txt-${id}`).textContent = `${Math.round(val * 100)}%`;
      }
    }

    function updatePan(id, val) {
      const track = tracks.find(t => t.id === id);
      if (track) {
        track.currentPan = parseFloat(val);
        track.panner.pan.value = track.currentPan;
      }
    }

    function deleteTrack(id) {
      stopAllTracks();
      const index = tracks.findIndex(t => t.id === id);
      if (index !== -1) {
        tracks[index].audioEl.pause();
        tracks.splice(index, 1);
      }
      renderMixerBoard();
    }

    function startAllTracks(options = {}) {
      if (!tracks || tracks.length === 0) return;
      tracks.forEach(track => {
        if (track.audioEl) {
          track.audioEl.play().catch(e => console.log("Playback delayed: ", e));
        }
      });
      if (!options.monitoringOnly) {
        isPlayingMix = true;
        masterPlayBtn.textContent = "Pause Mix";
      }
    }

    function stopAllTracks() {
      if (!tracks || tracks.length === 0) return;
      tracks.forEach(track => {
        if (track.audioEl) track.audioEl.pause();
      });
      isPlayingMix = false;
      masterPlayBtn.textContent = "Play Mix";
    }

    function updateUI() {
      const noTracks = !tracks || tracks.length === 0;
      masterPlayBtn.disabled = noTracks;
      resetBtn.disabled = noTracks;
      saveMixBtn.disabled = noTracks;
      
      if (tracks.length >= maxTracks) {
        recordBtn.disabled = true;
        recordBtn.textContent = "Max 4 Tracks Reached";
        recordBtn.className = "btn-record";
      } else {
        recordBtn.disabled = false;
        recordBtn.textContent = `Record Track ${tracks.length + 1}`;
        recordBtn.className = "btn-record";
      }
    }

    // --- Offline Rendering & WAV Export Engine ---
    saveMixBtn.addEventListener('click', async () => {
      if (!tracks || tracks.length === 0) return;
      initAudio();
      saveMixBtn.disabled = true;
      saveMixBtn.textContent = "Rendering Mix...";

      try {
        const decodePromises = tracks.map(async (track) => {
          const arrayBuffer = await track.blob.arrayBuffer();
          const tempCtx = new (window.AudioContext || window.webkitAudioContext)();
          const buffer = await tempCtx.decodeAudioData(arrayBuffer);
          tempCtx.close();
          return buffer;
        });

        const audioBuffers = await Promise.all(decodePromises);
        const maxDuration = Math.max(...audioBuffers.map(b => b.duration));
        const sampleRate = audioCtx.sampleRate;
        const offlineCtx = new OfflineAudioContext(2, sampleRate * maxDuration, sampleRate);

        tracks.forEach((track, index) => {
          const bufferSource = offlineCtx.createBufferSource();
          bufferSource.buffer = audioBuffers[index];

          const offlineGain = offlineCtx.createGain();
          offlineGain.gain.value = track.currentVolume;

          const offlinePanner = offlineCtx.createStereoPanner();
          offlinePanner.pan.value = track.currentPan;

          bufferSource.connect(offlineGain);
          offlineGain.connect(offlinePanner);
          offlinePanner.connect(offlineCtx.destination);

          bufferSource.start(0);
        });

        const renderedBuffer = await offlineCtx.startRendering();
        const wavBlob = audioBufferToWav(renderedBuffer);
        const downloadUrl = URL.createObjectURL(wavBlob);
        
        const anchor = document.createElement('a');
        anchor.href = downloadUrl;
        anchor.download = `4track-mix-${Date.now()}.wav`;
        document.body.appendChild(anchor);
        anchor.click();
        document.body.removeChild(anchor);
        URL.revokeObjectURL(downloadUrl);

      } catch (err) {
        console.error("Export failure:", err);
        alert("Failed to export the audio mix.");
      } finally {
        saveMixBtn.disabled = false;
        saveMixBtn.textContent = "Save Mix to File";
      }
    });

    function audioBufferToWav(buffer) {
      const numOfChan = buffer.numberOfChannels;
      const sampleRate = buffer.sampleRate;
      const format = 1; 
      const bitDepth = 16;
      
      let result;
      if (numOfChan === 2) {
        result = interleave(buffer.getChannelData(0), buffer.getChannelData(1));
      } else {
        result = buffer.getChannelData(0);
      }
      
      const bufferArr = new ArrayBuffer(44 + result.length * 2);
      const view = new DataView(bufferArr);
      
      writeString(view, 0, 'RIFF');
      view.setUint32(4, 36 + result.length * 2, true);
      writeString(view, 8, 'WAVE');
      writeString(view, 12, 'fmt ');
      view.setUint32(16, 16, true);
      view.setUint16(20, format, true);
      view.setUint16(22, numOfChan, true);
      view.setUint32(24, sampleRate, true);
      view.setUint32(28, sampleRate * numOfChan * (bitDepth / 8), true);
      view.setUint16(32, numOfChan * (bitDepth / 8), true);
      view.setUint16(34, bitDepth, true);
      writeString(view, 36, 'data');
      view.setUint32(40, result.length * 2, true);
      
      let offset = 44;
      for (let i = 0; i < result.length; i++, offset += 2) {
        let s = Math.max(-1, Math.min(1, result[i]));
        view.setInt16(offset, s < 0 ? s * 0x8000 : s * 0x7FFF, true);
      }
      
      return new Blob([view], { type: 'audio/wav' });
    }

    function interleave(inputL, inputR) {
      const length = inputL.length + inputR.length;
      const result = new Float32Array(length);
      let index = 0;
      let inputIndex = 0;
      
      while (index < length) {
        result[index++] = inputL[inputIndex];
        result[index++] = inputR[inputIndex];
        inputIndex++;
      }
      return result;
    }

    function writeString(view, offset, string) {
      for (let i = 0; i < string.length; i++) {
        view.setUint8(offset + i, string.charCodeAt(i));
      }
    }

    // Service Worker relative registration link setup
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(reg => console.log('Service Worker connected!'))
          .catch(err => console.log('SW registration issue: ', err));
      });
    }
  </script>
</body>
</html>
